services:
  tasker:
    build: .
    restart: unless-stopped
    environment:
      TASKER_DATABASE: /var/data/tasker.db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      TASKER_EMAIL_PROVIDER: ${TASKER_EMAIL_PROVIDER:-gmail}
      TASKER_GMAIL_EMAIL: ${TASKER_GMAIL_EMAIL:-}
      TASKER_GMAIL_APP_PASSWORD: ${TASKER_GMAIL_APP_PASSWORD:-}
      TASKER_BREVO_API_KEY: ${TASKER_BREVO_API_KEY:-}
      TASKER_BREVO_SENDER: ${TASKER_BREVO_SENDER:-}
    volumes:
      - tasker_data:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:10000/api/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TASKER_HOSTNAME: ${TASKER_HOSTNAME:?Set TASKER_HOSTNAME to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tasker_data:
  caddy_data:
  caddy_config:
