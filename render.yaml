services:
  - type: web
    name: tasker
    runtime: docker
    plan: starter
    healthCheckPath: /api/
    disk:
      name: tasker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TASKER_DATABASE
        value: /var/data/tasker.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TASKER_GMAIL_EMAIL
        sync: false
      - key: TASKER_GMAIL_APP_PASSWORD
        sync: false
